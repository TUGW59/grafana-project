name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugins:
    name: Plugin (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - tugcetopuz-bloomatlasworld-panel
          - samirapordugan-bloomatlasstory-panel
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: plugins/${{ matrix.plugin }}/.nvmrc
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build

  api:
    name: Deno API and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-read packages/contracts/tests/
      - run: deno task check
        working-directory: api
      - run: deno task test
        working-directory: api

  etl:
    name: Data scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/etl -p "test_*.py"
